spring.datasource.url=jdbc:postgresql://localhost:5432/cobre
spring.datasource.username=cobre
spring.datasource.password=cobre

spring.kafka.bootstrap-servers=localhost:9092

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway - Disable validation for local development
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true
spring.flyway.baseline-on-migrate=false

# Actuator - Expose health and metrics
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always

# Resilience4j Retry Configuration
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=1000
resilience4j.retry.configs.default.interval-function=exponential
resilience4j.retry.configs.default.exponential-backoff-multiplier=2
resilience4j.retry.instances.webhookDelivery.base-config=default

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30000
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.webhookDelivery.base-config=default

# Logging
logging.level.root=INFO
logging.level.com.cobre.notification=DEBUG
logging.level.io.github.resilience4j=INFO
